<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Module Launcher</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}
.page{
    max-width:1400px;
    margin:0 auto;
    padding:24px;
}
.hero{
    background:#181818;
    border:1px solid #c40000;
    border-radius:14px;
    padding:20px;
    margin-bottom:24px;
    box-shadow:0 0 12px rgba(196,0,0,0.35);
}
.hero h1{
    margin:0 0 8px;
    font-size:32px;
}
.hero p{
    margin:0;
    color:#bbb;
}
.topbar{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}
input{
    flex:1;
    min-width:240px;
    padding:12px;
    border-radius:10px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
    font-size:15px;
}
button{
    padding:12px 18px;
    border-radius:10px;
    border:1px solid #c40000;
    background:#111;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 0 #7a0000;
}
button:hover{
    background:#1b1b1b;
}
.status{
    color:#aaa;
    font-size:13px;
    margin-bottom:20px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
}
.tile{
    background:#181818;
    border:1px solid #333;
    border-radius:14px;
    padding:18px;
    transition:0.2s;
}
.tile:hover{
    border-color:#c40000;
    transform:translateY(-2px);
}
.tile h3{
    margin-top:0;
    color:#fff;
}
.tile p{
    color:#aaa;
    font-size:14px;
    min-height:38px;
}
.tile a{
    display:inline-block;
    margin-top:12px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #c40000;
    text-decoration:none;
    color:#fff;
    font-size:14px;
}
.tile a:hover{
    background:#c40000;
}
.badge{
    display:inline-block;
    margin-bottom:10px;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid #444;
    color:#bbb;
    font-size:12px;
}
.empty{
    border:1px dashed #555;
    border-radius:14px;
    padding:22px;
    color:#aaa;
    background:#181818;
}
.footer{
    text-align:center;
    margin-top:40px;
    color:#666;
    font-size:12px;
}
@media(max-width:700px){
    .topbar{ flex-direction:column; }
    button{ width:100%; }
}
</style>

<style id="playbook-tool-header-style">
.playbookToolHeader{background:#071020;border-bottom:1px solid rgba(255,255,255,.14);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:Arial,Helvetica,sans-serif;position:relative;z-index:1000}
.playbookToolHeader .brand{color:#fff;font-weight:900;margin-right:8px}
.playbookToolHeader a{color:#fff!important;text-decoration:none!important;background:#111a2d;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-weight:800;line-height:1.1}
.playbookToolHeader a:hover{border-color:rgba(239,68,68,.85);background:rgba(198,40,40,.25)}
@media print{.playbookToolHeader{display:none!important}}
</style>
</head>

<body>
<div class="playbookToolHeader"><span class="brand">BW Playbook</span><a href="../index.html">Dashboard</a><a href="../resources-tools.html">Tools</a><a href="javascript:history.back()">Back</a></div>


<div class="page">

    <section class="hero">
        <h1>Test Module Launcher</h1>
        <p>Launcher for beta/test modules hosted under <strong>/test/</strong>.</p>
    </section>

    <div class="topbar">
        <input type="text" id="search" placeholder="Search modules...">
        <button onclick="resetSearch()">Show All</button>
    </div>

    <div class="status" id="status"></div>

    <div class="grid" id="moduleGrid"></div>

    <div class="footer">
        Designed and built by H. Fitzgerald
    </div>

</div>

<script>
const modules = [
    {
        title: "Timken SBHU Interchange",
        file: "timken-sbhu-interchange/",
        description: "Timken mounted unit crossover/interchange module.",
        type: "Folder Module"
    },
    {
        title: "Mounted Unit X-Ref",
        file: "mounted-unit-xref/",
        description: "Mounted unit cross-reference search module.",
        type: "Folder Module"
    },
    {
        title: "Mounted Unit Interchange",
        file: "mounted-unit-interchange-module/mounted-unit-interchange/",
        description: "Mounted unit interchange module.",
        type: "Folder Module"
    },
    {
    title: "Oil Seal Search",
    file: "oil-seal-search/",
    description: "Search oil seals by ID, OD, width, BW part number, barcode and fitment.",
    type: "Folder Module"
},
{
    title: "Bearing Size Search",
    file: "bearing-size-search/",
    description: "Search bearings by ID, OD, width, part number and type.",
    type: "Folder Module"
},
{
    title: "Timken Tapered Search",
    file: "timken-tapered-search-module/",
    description: "Search Timken tapered roller bearings by bore, OD, stack height, cone height and cup height.",
    type: "Folder Module"
}
];

function renderModules(list){
    const grid = document.getElementById("moduleGrid");
    const status = document.getElementById("status");

    grid.innerHTML = "";

    status.textContent = `${list.length} module(s) available.`;

    if (!list.length) {
        grid.innerHTML = `<div class="empty">No matching modules found.</div>`;
        return;
    }

    list
        .sort((a,b) => a.title.localeCompare(b.title))
        .forEach(module => {
            const tile = document.createElement("div");
            tile.className = "tile";

            tile.innerHTML = `
                <span class="badge">${module.type}</span>
                <h3>${module.title}</h3>
                <p>${module.description}</p>
                <a href="${module.file}">Open Module</a>
            `;

            grid.appendChild(tile);
        });
}

function resetSearch(){
    document.getElementById("search").value = "";
    renderModules(modules);
}

document.getElementById("search").addEventListener("input", function(){
    const term = this.value.toLowerCase();

    const filtered = modules.filter(module =>
        module.title.toLowerCase().includes(term) ||
        module.file.toLowerCase().includes(term) ||
        module.description.toLowerCase().includes(term) ||
        module.type.toLowerCase().includes(term)
    );

    renderModules(filtered);
});

renderModules(modules);
</script>

</body>
</html>
