<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cabinet Builder</title>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
:root{--bg:#101216;--panel:#181b22;--panel2:#202530;--text:#f5f7fb;--muted:#aeb6c3;--red:#c62828;--line:rgba(255,255,255,.12);--blue:#1179c9;--blue2:#0699eb;--green:#63e087;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;} .container{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.logo{height:68px;object-fit:contain}.nav{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(198,40,40,.75);background:rgba(198,40,40,.12);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.22)}.btn:hover{background:rgba(198,40,40,.22)}.btn.secondary{border-color:var(--line);background:rgba(255,255,255,.05)}h1{font-size:32px;margin:0 0 6px}p{color:var(--muted);margin:0}.hero,.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:22px;padding:18px;box-shadow:0 16px 34px rgba(0,0,0,.22);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-weight:800;font-size:12px;margin:0 0 6px}.field input,.field select{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:0 11px}.field input[type=number]{appearance:textfield}.field.wide{grid-column:span 2}.work{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}.cabinet{border:1px solid var(--line);background:#dfe5ec;border-radius:12px;padding:12px;box-shadow:inset 0 0 0 6px #2c79bd,0 18px 36px rgba(0,0,0,.24)}.cabTitle{color:#16202c;font-weight:900;text-align:center;margin:0 0 10px}.drawer{height:58px;border-radius:6px;background:linear-gradient(#f5f6f8,#d3d8df);border:1px solid #aeb6c1;margin:8px 0;position:relative;color:#17202c;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.drawer:hover{transform:scale(1.04);box-shadow:0 12px 22px rgba(0,0,0,.2)}.drawer.active{outline:4px solid var(--red);transform:scale(1.05)}.drawerHandle{position:absolute;left:18px;right:18px;bottom:8px;height:7px;border-radius:99px;background:#b8c0ca}.drawerMeta{font-size:11px;color:#344055;position:absolute;right:10px;top:8px}.drawerView{min-height:420px;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}.drawerHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.drawerHeader h2{margin:0;font-size:22px}.tray{display:grid;gap:14px;align-items:start}.trayRow{display:flex;gap:10px;align-items:center}.rowLabel{width:46px;color:var(--muted);font-weight:900}.bin{position:relative;width:76px;height:68px;min-width:76px;border-radius:12px;border:2px solid rgba(0,149,235,.65);background:linear-gradient(180deg,var(--blue2),var(--blue));cursor:pointer;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 8px 18px rgba(0,0,0,.22);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;transform-origin:center}.bin:before{content:"";position:absolute;left:12px;right:12px;top:12px;height:24px;border-radius:0 0 12px 12px;background:rgba(0,0,0,.18)}.bin:hover{transform:scale(1.10);z-index:20;box-shadow:0 20px 42px rgba(0,0,0,.38);filter:saturate(1.18)}.binCode{position:absolute;left:7px;bottom:6px;font-size:10px;font-weight:900;color:white;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:4}.cascade{position:absolute;left:16px;top:8px;width:40px;height:40px;z-index:3;pointer-events:none}.pos{position:absolute;width:28px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.9);background:rgba(230,244,255,.88);color:#0d1a28;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(0,0,0,.26);left:calc(var(--i)*4px);top:calc(var(--i)*3px);transition:left .18s ease,top .18s ease,transform .18s ease,background .18s ease;pointer-events:auto}.pos.filled{background:rgba(99,224,135,.94)}.bin:hover .pos{left:calc(var(--i)*16px);top:calc(var(--i)*10px)}.pos:hover{transform:scale(1.12);background:#fff}.listWrap{overflow:auto;border-radius:16px;border:1px solid var(--line);max-height:520px}.table{width:100%;border-collapse:collapse;min-width:780px;background:rgba(255,255,255,.025)}.table th,.table td{border-bottom:1px solid rgba(255,255,255,.08);padding:8px 10px;text-align:left;font-size:13px}.table th{position:sticky;top:0;background:#222733;z-index:2}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.08);font-weight:900}.status{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}.dialogBack{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:9999;align-items:center;justify-content:center;padding:18px}.dialogBack.active{display:flex}.dialog{width:min(520px,100%);background:#171b23;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.dialog h3{margin:0 0 8px}.dialog .loc{color:var(--muted);font-weight:800;margin-bottom:12px}.dialog label{display:block;color:var(--muted);font-weight:800;font-size:13px;margin:12px 0 6px}.dialog input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:0 12px}.dialog input#part{text-transform:uppercase}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.footer{text-align:center;color:rgba(255,255,255,.45);font-size:12px;margin-top:24px}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.field.wide{grid-column:span 1}.work{grid-template-columns:1fr}.cabinet{max-width:420px}.trayRow{overflow:auto;padding-bottom:8px}}@media(max-width:640px){.grid{grid-template-columns:1fr}.top{display:block}.logo{height:58px;margin-bottom:10px}.bin{width:66px;min-width:66px}.rowLabel{width:38px}}
</style>
</head>
<body data-back="rack-builder.html">
<div class="container">
  <div class="top">
    <img class="logo" src="assets/img/logo-cropped-white.png" alt="Bearing Wholesalers" onerror="this.style.display='none'" />
    <div class="nav"><button class="btn secondary" onclick="history.back()">Back</button><button class="btn secondary" onclick="location.href='index.html'">Dashboard</button></div>
  </div>
  <section class="hero"><h1>Cabinet Builder</h1><p>Drawer-cabinet version of the rack map builder. Cabinet → Drawer → Row → Bin → Position.</p></section>
  <section class="card">
    <div class="grid">
      <div class="field wide"><label>Customer / Site</label><input id="site" placeholder="Customer or branch" /></div>
      <div class="field"><label>Cabinet ID</label><input id="cabinet" value="C01" /></div>
      <div class="field"><label>Drawers</label><input id="drawers" type="number" min="1" value="4" /></div>
      <div class="field"><label>Rows / Drawer</label><input id="rows" type="number" min="1" value="3" /></div>
      <div class="field"><label>Bins / Row</label><input id="bins" type="number" min="1" value="10" /></div>
      <div class="field"><label>Positions / Bin</label><input id="positions" type="number" min="1" max="6" value="1" /></div>
    </div>
    <div class="nav" style="margin-top:14px"><button class="btn" id="buildBtn">Build / Refresh Cabinet</button><button class="btn secondary" id="exportBtn">Export CSV</button><button class="btn secondary" id="clearBtn">Clear Parts</button></div>
    <input id="fileIn" type="file" accept=".csv" style="display:none" />
  </section>
  <section class="work">
    <div class="card"><div id="cabinetView" class="cabinet"></div></div>
    <div class="card"><div id="drawerView" class="drawerView"></div></div>
  </section>
  <section class="card"><h2 style="margin:0 0 12px">Location List</h2><div class="listWrap"><table class="table" id="locTable"></table></div><div class="status" id="status"></div></section>
  <div class="footer">Designed and built by H. Fitzgerald</div>
</div>
<div class="dialogBack" id="dialogBack">
  <div class="dialog">
    <h3>Edit Position</h3><div class="loc" id="editLoc"></div>
    <label>Part Number</label><input id="part" autocomplete="off" />
    <label>Description</label><input id="desc" autocomplete="off" />
    <div class="actions"><button class="btn secondary" id="deleteBtn">Clear</button><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button></div>
  </div>
</div>
<script>
const S = {activeDrawer:1, rows:[], current:null};
const $ = id => document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function letter(i){return String.fromCharCode(64+i)}
function cfg(){return {site:$('site').value.trim(), cabinet:($('cabinet').value.trim()||'C01').toUpperCase(), drawers:+$('drawers').value||1, rows:+$('rows').value||1, bins:+$('bins').value||1, positions:Math.min(6,+$('positions').value||1)}}
function loc(c,d,r,b,p){return `${c.cabinet}-D${pad(d)}-R${pad(r)}-B${pad(b)}-${letter(p)}`}
function build(){const c=cfg(); const old=new Map(S.rows.map(x=>[x.LocationCode,x])); S.rows=[]; for(let d=1;d<=c.drawers;d++)for(let r=1;r<=c.rows;r++)for(let b=1;b<=c.bins;b++)for(let p=1;p<=c.positions;p++){const code=loc(c,d,r,b,p); const prev=old.get(code)||{}; S.rows.push({StorageType:'Drawer Cabinet',Site:c.site,Cabinet:c.cabinet,Drawer:`D${pad(d)}`,Row:`R${pad(r)}`,Bin:`B${pad(b)}`,Position:letter(p),LocationCode:code,PartNumber:(prev.PartNumber||'').toUpperCase(),Description:prev.Description||''})} if(S.activeDrawer>c.drawers)S.activeDrawer=1; renderAll()}
function renderCabinet(){const c=cfg(); let html=`<div class="cabTitle">${c.cabinet} — Drawer Cabinet</div>`; for(let d=1;d<=c.drawers;d++){const count=S.rows.filter(x=>x.Drawer===`D${pad(d)}`&&x.PartNumber).length; html+=`<div class="drawer ${d===S.activeDrawer?'active':''}" data-d="${d}">Drawer ${pad(d)}<span class="drawerMeta">${count} filled</span><span class="drawerHandle"></span></div>`} $('cabinetView').innerHTML=html; document.querySelectorAll('.drawer').forEach(el=>el.onclick=()=>{S.activeDrawer=+el.dataset.d; renderAll()})}
function renderDrawer(){const c=cfg(); let html=`<div class="drawerHeader"><h2>${c.cabinet} / Drawer ${pad(S.activeDrawer)}</h2><span class="pill">hover bins to expand positions</span></div><div class="tray">`; for(let r=1;r<=c.rows;r++){html+=`<div class="trayRow"><div class="rowLabel">R${pad(r)}</div>`; for(let b=1;b<=c.bins;b++){html+=`<div class="bin" data-d="${S.activeDrawer}" data-r="${r}" data-b="${b}"><div class="cascade">`; for(let p=1;p<=c.positions;p++){const code=loc(c,S.activeDrawer,r,b,p); const item=S.rows.find(x=>x.LocationCode===code); html+=`<div class="pos ${item&&item.PartNumber?'filled':''}" style="--i:${p-1}" data-code="${code}" title="${code}">${letter(p)}</div>`} html+=`</div><div class="binCode">B${pad(b)}</div></div>`} html+=`</div>`} html+=`</div>`; $('drawerView').innerHTML=html; document.querySelectorAll('.pos').forEach(el=>el.onclick=(e)=>{e.stopPropagation(); openEdit(el.dataset.code)})}
function renderTable(){let html='<thead><tr><th>Location</th><th>Cabinet</th><th>Drawer</th><th>Row</th><th>Bin</th><th>Position</th><th>Part Number</th><th>Description</th></tr></thead><tbody>'; S.rows.forEach(x=>{html+=`<tr><td><b>${x.LocationCode}</b></td><td>${x.Cabinet}</td><td>${x.Drawer}</td><td>${x.Row}</td><td>${x.Bin}</td><td>${x.Position}</td><td>${x.PartNumber||''}</td><td>${x.Description||''}</td></tr>`}); html+='</tbody>'; $('locTable').innerHTML=html; const filled=S.rows.filter(x=>x.PartNumber).length; $('status').innerHTML=`<span>Total positions: <b>${S.rows.length}</b></span><span>Filled: <b>${filled}</b></span><span>Empty: <b>${S.rows.length-filled}</b></span>`}
function renderAll(){renderCabinet(); renderDrawer(); renderTable()}
function openEdit(code){S.current=code; const item=S.rows.find(x=>x.LocationCode===code); $('editLoc').textContent=code; $('part').value=item?.PartNumber||''; $('desc').value=item?.Description||''; $('dialogBack').classList.add('active'); setTimeout(()=>$('part').focus(),20)}
function closeEdit(){S.current=null; $('dialogBack').classList.remove('active')}
function saveEdit(){const item=S.rows.find(x=>x.LocationCode===S.current); if(item){item.PartNumber=$('part').value.trim().toUpperCase(); item.Description=$('desc').value.trim()} closeEdit(); renderAll()}
function clearEdit(){const item=S.rows.find(x=>x.LocationCode===S.current); if(item){item.PartNumber=''; item.Description=''} closeEdit(); renderAll()}
function csvEscape(v){v=String(v??''); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function exportCsv(){const headers=['StorageType','Site','Cabinet','Drawer','Row','Bin','Position','LocationCode','PartNumber','Description']; const lines=[headers.join(',')].concat(S.rows.map(r=>headers.map(h=>csvEscape(r[h])).join(','))); const blob=new Blob([lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`cabinet-builder-${cfg().cabinet}.csv`; a.click(); URL.revokeObjectURL(a.href)}
$('buildBtn').onclick=build; $('exportBtn').onclick=exportCsv; $('clearBtn').onclick=()=>{if(confirm('Clear all part numbers and descriptions?')){S.rows.forEach(x=>{x.PartNumber='';x.Description=''}) ;renderAll()}}; $('saveBtn').onclick=saveEdit; $('cancelBtn').onclick=closeEdit; $('deleteBtn').onclick=clearEdit; $('dialogBack').addEventListener('click',e=>{if(e.target.id==='dialogBack')closeEdit()}); document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit(); if(e.key==='Enter'&&$('dialogBack').classList.contains('active'))saveEdit()}); ['site','cabinet','drawers','rows','bins','positions'].forEach(id=>$(id).addEventListener('change',build)); build();
</script>
</body>
</html>
